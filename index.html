<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>セミナーインタビュー</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <!-- 開始画面 -->
    <div id="startScreen">
        <h1>セミナーインタビュー</h1>
        <p>自由会話はGeminiで生成し、チェックポイントと終了判定はアプリ側で検証します。</p>
        <div class="model-select-wrap">
            <label for="modelSelect">モデル</label>
            <select id="modelSelect">
                <option value="gemini-2.5-flash"
                        selected>gemini-2.5-flash（高速・低コスト）</option>
                <option value="gemini-2.5-pro">gemini-2.5-pro（高品質・高コスト）</option>
            </select>
        </div>
        <button id="startBtn">開始する</button>
        <div class="start-error"
             id="startError">開始できませんでした</div>
    </div>

    <!-- メイン画面 -->
    <div id="mainScreen">
        <div class="chat-header">
            <div>
                <div class="chat-header-title">AI活用セミナー</div>
                <div class="chat-header-sub">インタビュー</div>
            </div>
            <div class="progress-wrap"
                 id="progressDots"></div>
        </div>

        <div class="messages"
             id="messages"></div>

        <div class="input-area"
             id="inputArea">
            <textarea id="userInput"
                      placeholder="気軽に話してください"></textarea>
            <button class="send-btn"
                    id="sendBtn"
                    aria-label="送信">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2.5"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <line x1="12"
                          y1="19"
                          x2="12"
                          y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>

        <div class="debug-panel">
            <div class="debug-title">通過地点（開発用表示）</div>
            <div class="check-items"
                 id="checkItems"></div>
            <div class="usage-stats"
                 id="usageStats"></div>
            <div class="ended-note"
                 id="endedNote">会話が完了しました</div>
            <button class="log-btn"
                    id="logBtn">JSONログをダウンロード</button>
        </div>
    </div>

    <script src="/interview-flow.js"></script>
    <script src="/app.js"></script>
</body>

</html>
